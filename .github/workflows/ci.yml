name: Frontend CI

on:
  push:
    branches: [ "main" ] # Chạy khi push vào nhánh main
  pull_request:
    branches: [ "main" ] # Chạy khi tạo PR vào nhánh main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Lint (Kiểm tra chuẩn code)
        run: npm run lint

      - name: Run Unit Tests (Quan trọng nhất)
        run: npm test